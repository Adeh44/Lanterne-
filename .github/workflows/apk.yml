name: Fabriquer l'appli Android
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: node scripts/prep.js
      - run: npx cap sync android
      - name: Clé de signature fixe (pour que les mises à jour s'installent par-dessus)
        run: mkdir -p ~/.android && cp keys/debug.keystore ~/.android/debug.keystore
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Lanterne.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Lanterne v${{ github.run_number }}
          body: "Télécharge Lanterne.apk depuis ton téléphone et installe-le. Une mise à jour s'installe par-dessus la précédente, ta partie est gardée."
          files: Lanterne.apk
          make_latest: true
