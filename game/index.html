"use strict";
// ================= OUTILS =================
const $=id=>document.getElementById(id);
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=Math.random;
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
function fmt(n){n=Math.floor(n);if(n<1000)return""+n;const u=[["Md",1e9],["M",1e6],["k",1e3]];for(const[s,v]of u)if(n>=v){const x=n/v;return(x<10?x.toFixed(1):Math.floor(x))+s}return""+n}
const today=()=>new Date().toISOString().slice(0,10);

const DEF={v:3,st:{tot:0,pts:0,reach:{},kills:0,saved:0,docs:0},gad:{eq:null,gren:-1,lure:-1,smoke:-1},ore:0,mat:{chit:0,gland:0,crist:0,brai:0,pale:0,nacr:0,lton:0},best:0,runs:0,deaths:0,mine:0,up:{mat:0,cal:0,meca:0,ray:0,meche:0,verre:0,refl:0,res:0},arm:{eq:"cuir",cuir:0,chit:-1,plaq:-1},echoes:[],last:Date.now(),un:{},seen:{},day:"",run:null,opt:{nums:true,eco:false,son:true},letter:false,won:false};
let S;
const SLOT=(()=>{try{return localStorage.getItem("lanterne_slot")==="2"?2:1}catch(e){return 1}})(),SKEY=SLOT===2?"lanterne_v1_b":"lanterne_v1"; // deux parties indépendantes
function load(){try{const t=localStorage.getItem(SKEY);S=t?Object.assign(JSON.parse(JSON.stringify(DEF)),JSON.parse(t)):JSON.parse(JSON.stringify(DEF))}catch(e){S=JSON.parse(JSON.stringify(DEF))}}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}}
load();
if(S.un&&S.un.petard&&S.best<8){S.un.petard=0}
if(!S.st)S.st=JSON.parse(JSON.stringify(DEF.st));for(const k of["brai","pale","nacr","lton"])if(typeof S.mat[k]!=="number")S.mat[k]=0;if(!S.seed)S.seed=1+Math.floor(Math.random()*2147483646);if(!S.gad)S.gad=JSON.parse(JSON.stringify(DEF.gad));

// ================= SON (synthétisé) =================
let AC=null,SPAT=null; // SPAT : spatialisation du son en cours {vol,pan,lp}
function sndOut(g){let n=g;if(SPAT){if(SPAT.lp<9000){const f=AC.createBiquadFilter();f.type="lowpass";f.frequency.value=SPAT.lp;n.connect(f);n=f}if(SPAT.pan&&AC.createStereoPanner){const p=AC.createStereoPanner();p.pan.value=SPAT.pan;n.connect(p);n=p}}n.connect(AC.destination)}
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume()}
function tone(type,f1,f2,dur,vol){if(!AC||!S.opt.son)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(f2,20),t+dur);g.gain.setValueAtTime(vol*(SPAT?SPAT.vol:1),t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);sndOut(g);o.start(t);o.stop(t+dur)}
let NB=null;
function noise(dur,freq,vol,q){if(!AC||!S.opt.son)return;if(!NB){NB=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type="bandpass";f.frequency.value=freq;f.Q.value=q||1;g.gain.setValueAtTime(vol*(SPAT?SPAT.vol:1),t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f).connect(g);sndOut(g);s.start(t);s.stop(t+dur)}
const SFX={
 shot(){noise(.06,1900,.18,.8);tone("square",420,120,.05,.03)},
 hit(){tone("square",220,70,.08,.06)},
 kill(){noise(.25,500,.2,.6);tone("sawtooth",160,40,.25,.05)},
 pick(){tone("sine",880,1500,.12,.07)},
 oil(){tone("sine",300,600,.2,.07)},
 alert(){tone("sawtooth",260,620,.16,.05)},

 drip(){tone("sine",1400+Math.random()*600,500,.12,.025)},
 stairs(){tone("triangle",330,660,.4,.07);setTimeout(()=>tone("triangle",495,990,.4,.06),120)},
 boss(){tone("sawtooth",80,40,.8,.12);noise(.6,200,.2,.5)},
 scream(){tone("sawtooth",700,1500,.6,.07);tone("square",1100,2000,.5,.03);noise(.6,2500,.1,2)},
 step(){noise(.03,1300,.05,2)},

 thud(){tone("sine",110,40,.2,.12);noise(.15,220,.14,.6)},

function rayDist(x,y,dx,dy,max){

 while(d<max){if(tx<ty){d=tx;tx+=tdx;mx+=sx}else{d=ty;ty+=tdy;my+=sy}if(solid(mx,my))return Math.min(d,max)}

function emit(x,y,loud,kind,src){

function drawWaves(c,ox,oy){

 flair:{f:3,t:[{w:"carnet",t:"« Jour 9. Ils nous sentent. Gaspard était caché, immobile, lampe baissée. Mais le courant allait de lui vers eux. »"},{w:"carnet",t:"« Regarder la poussière dans la lumière avant d'avancer. Si elle file vers eux, ils savent déjà. Si elle vient vers moi, je n'existe pas. »"}]},
 faim:{f:4,t:[{w:"carnet",t:"« Jour 10. On a abattu un Rampant près de la grande salle. Le temps de recharger, deux autres étaient dessus. Pas sur nous. Sur lui. »"},{w:"carnet",t:"« Ils ont faim. Tous. Une bête qui mange ne regarde plus rien. Une bête qui a mangé se couche sur place et dort, et on passe à côté sur la pointe des pieds. »"},{w:"carnet",t:"« Clotilde a coupé un morceau de la carcasse et l'a posé dans la galerie d'à côté. Le courant a fait le reste : la salle s'est vidée toute seule. »"},{w:"carnet",t:"« Seulement, la viande, ça se sent. Tant qu'on l'avait sur nous, tout le puits savait où on était. »"}]},
 ronge:{f:5,t:[{w:"carnet",t:"« Jour 11. Des petites choses, par bandes. On les entend gratter avant de les voir. Elles nettoient une carcasse jusqu'à l'os. Honoré les appelle les Ronge-os. »"},{w:"carnet",t:"« Seules, elles détalent. À quatre ou cinq, elles s'en prennent à tout ce qui est seul : un Cracheur, un Rampant à l'écart. Nous. »"},{w:"carnet",t:"« On en a tué deux, les autres ont filé. Les Rampants affamés, eux, les gobent comme des noisettes. »"}]},
 glou:{f:6,t:[{w:"carnet",t:"« Jour 13. Quelque chose de gros mange les Rampants. On a trouvé les restes. Puis on a trouvé la chose. »"},{w:"carnet",t:"« Nos balles l'agacent, sans plus. Anselme l'appelle le Glouton : il ne s'arrête de marcher que pour manger. Les autres bêtes s'enfuient quand il arrive. On a fait pareil. »"},{w:"carnet",t:"« Léonce lui a jeté sa viande et a couru. Il s'est arrêté net pour manger. Ensuite il s'est couché là, au milieu de la galerie, et il a dormi comme un bébé. Un très gros bébé. »"}]},
 gris:{f:5,t:[{w:"carnet",t:"« Jour 12. La flamme de Mathurin est devenue bleue, haute, très belle. Il a dit : venez voir. »"},{w:"carnet",t:"« Puis il a tiré sur une bête. On l'a retrouvé trois galeries plus loin, sourd, sans sourcils, et très poli depuis. »"},{w:"carnet",t:"« Flamme bleue : on ne tire pas. On recule. Ou on attend que le puits souffle le gaz ailleurs. »"}]},
 braise:{f:11,t:[{w:"cahier",t:"« Pour Lise, si tu lis un jour par-dessus mon épaule. Sous la porte, la roche est chaude. La lueur rouge brûle, et tout ce qui se tient près d'elle se voit de très loin. Moi compris. »"},{w:"cahier",t:"« Les fissures qui sifflent crachent leur vapeur toujours au même rythme. Je compte, et je passe juste après. Les bêtes, elles, ne savent pas compter. »"},{w:"cahier",t:"« Certains Rampants ont avalé de la braise. On les voit venir dans le noir, mais près d'eux on est en pleine lumière. Abattus, ils se vident en flaque brûlante. Mouchés en silence : rien. »"},{w:"moi",t:"…Cette écriture. Je la connais."}]},
 prenom:{f:13,t:[{w:"cahier",t:"« J'ai gravé mon prénom près de la porte, là-haut, pour que tu saches que je suis passé. Ici, je trace des flèches à la craie. Je ne sais plus très bien pour qui. »"},{w:"moi",t:"Le prénom sur le mur… Alors ce n'était pas le mien. Ou alors nous portons le même."}]},
 pas:{f:14,t:[{w:"cahier",t:"« Quelqu'un me suit. Des petits pas. J'ai laissé ma gourde et du pain sur une pierre plate. Au matin il ne restait rien, et un dessin à la craie : un cheval. »"},{w:"cahier",t:"« Je ne peux pas remonter. Si j'arrête de descendre, j'arrête de me souvenir. »"}]},
 silence:{f:15,t:[{w:"cahier",t:"« Plus bas, il n'y a plus de braise. La roche boit la lumière : ma lampe porte moins loin, et eux me voient toujours d'aussi loin. »"},{w:"cahier",t:"« Le sol est semé d'éclats d'os. Même au pas lent, ça craque. Je regarde où je pose le pied, et je longe ce qui est propre. »"},{w:"cahier",t:"« Il y a des cristaux blancs qui répètent ce qu'ils entendent. Un coup de feu trop près, et ils chantent, et tout ce qui a des oreilles accourt. Vers eux. Pas vers moi. Ça peut servir. »"}]},
 figes:{f:16,t:[{w:"cahier",t:"« J'ai trouvé des mineurs. Debout, la lampe éteinte à la main, gris comme la pierre. Je les ai crus morts. »"},{w:"cahier",t:"« J'ai tourné le dos pour remonter ma mèche. Quand je me suis retourné, ils étaient plus près. »"},{w:"cahier",t:"« Ils ne bougent que lorsque la lumière les quitte, et les balles ricochent tant qu'ils sont figés. Mais si je marche droit sur eux sans cesser de les éclairer, ils se laissent briser comme du sel. »"}]},
 chant:{f:18,t:[{w:"cahier",t:"« Je ne dors plus. Je chante. Quand je chante, ce qui est en dessous respire plus lentement. Je crois que c'est pour ça que le puits m'a gardé. »"},{w:"cahier",t:"« Si quelqu'un descend jusqu'ici avec une lanterne comme la mienne : qu'on ne le chasse pas. Je crois que je l'attends. »"}]},
 fin:{f:19,t:[{w:"cahier",t:"« Dernière page. La salle d'en dessous résonne, j'y resterai. Lise, le cheval bleu t'attend à la maison, sur l'étagère. »"},{w:"cahier",t:"« Dis à Mamie que je n'ai pas eu peur. Ce n'est pas vrai, mais dis-le quand même. »"}]}};
// ----- récit des Eaux noires : un carnet très ancien, à l'écriture ronde et appliquée -----
WHO.vieux=["Un carnet très ancien",SP.page];WHO.regi=["Registre de l'éclusier",SP.doc];
Object.assign(PAGES,{
 eau:{f:21,t:[{w:"vieux",t:"« Ici, ce n'est pas l'eau qui est noire, c'est le fond. Dans l'eau basse, je ne m'entends plus marcher. Mais ma lampe s'y reflète, et ça se voit de loin. »"},{w:"vieux",t:"« Là où je n'ai plus pied, je nage. Une main pour la lampe, une main pour l'eau : il ne m'en reste plus pour rien d'autre. »"},{w:"moi",t:"L'encre a pâli. L'écriture est ronde, appliquée. Une écriture de jeune fille, et ce carnet a des dizaines d'années."}]},
 nageur:{f:22,t:[{w:"vieux",t:"« Il y a quelque chose dans les bassins profonds. On ne voit que des rides. Dès que je mets un pied dans l'eau, les rides viennent vers moi. »"},{w:"vieux",t:"« Il jaillit d'un coup, puis il replonge. Dans l'eau basse, il ne peut pas se cacher. Je longe les bords, loin du profond, lampe baissée. »"}]},
 courant:{f:23,t:[{w:"vieux",t:"« Par ici, l'eau tourne. Elle file vers des trous au fond des bassins et emporte tout ce qu'on y laisse. Moi aussi, presque. »"},{w:"vieux",t:"« Ne jamais nager près d'un tourbillon. Ce qui y descend ne remonte pas. »"}]},
 sangsues:{f:24,t:[{w:"vieux",t:"« Des sangsues, en grappes. Ce n'est pas mon sang qu'elles veulent : elles boivent l'huile de ma lampe, à travers moi. »"},{w:"vieux",t:"« Elles se détachent toutes seules si je sors de l'eau et que je reste au sec. Il faut juste avoir la patience de rester au sec. »"}]},
 traces:{f:25,t:[{w:"vieux",t:"« Il est passé par ici. Ses traces sont dans la vase, longues, régulières. Il ne s'est jamais arrêté pour dormir. »"},{w:"vieux",t:"« Je ne sais pas s'il m'entend l'appeler. Je ne sais même pas s'il se souvient de mon nom. »"}]},
 maree:{f:26,t:[{w:"vieux",t:"« L'eau respire, elle aussi, mais plus lentement que l'air. Elle monte, elle tient, elle redescend. Un peu plus d'une minute, à peu près. »"},{w:"vieux",t:"« Quand elle monte, les gués deviennent des bassins. Je reste sur les hauteurs, et j'attends qu'elle reparte. »"}]},
 lucioles:{f:28,t:[{w:"vieux",t:"« De petites lumières vertes dansent au ras de l'eau. Elles adorent ma lampe. Quand elles me tournent autour, tout le noir me voit. »"},{w:"vieux",t:"« Mèche baissée, elles s'ennuient et retournent à leur eau. »"}]},
 forge:{f:30,t:[{w:"vieux",t:"« Papa a forgé douze lanternes pour la Compagnie. Je les ai portées moi-même jusqu'au monte-charge. »"},{w:"vieux",t:"« La nuit d'avant, il en a forgé une treizième, sans rien dire à personne. Je l'ai vu faire depuis l'escalier. »"}]},
 machines:{f:33,t:[{w:"vieux",t:"« J'entends des machines. Des roues, des chaînes, de l'eau qu'on retient. La Compagnie a construit quelque chose, tout en bas. »"}]},
 chanson:{f:36,t:[{w:"vieux",t:"« Je chante pour ne pas avoir peur. La chanson du cheval bleu, celle que maman me chantait. Les bêtes de l'eau l'écoutent, je crois. »"}]},
 ecluse:{f:39,t:[{w:"vieux",t:"« Le gardien de l'écluse ne craint rien dans l'eau. Mais il ne sait pas compter les vannes, et hors de l'eau, ce n'est plus qu'un très gros poisson. »"},{w:"vieux",t:"« Demain, je ferme l'écluse. »"}]}});
function onBossDead3(){
 S.won3=1;for(const b of L.basins)b.st="dead";save();lull(.04,0);
 say([{w:"moi",t:"Il ne bouge plus. Les trois bassins se vident d'un coup, dans un grondement qui remonte tout le puits."},
  {w:"moi",t:"Au fond du bassin nord, une cabane de planches noircies par l'eau. Sur la table, un registre."},
  {w:"regi",t:"« Registre de l'éclusier, puits n°3. Le niveau tient. Ce qui dort en dessous dort mieux quand l'eau est haute. Consigne de la Compagnie : ne jamais ouvrir. »"},
  {w:"regi",t:"« Livraison du forgeron de Fosse-Grise : douze lanternes neuves. Le livreur les a comptées deux fois. À l'arrivée, il y en avait treize. »"},
  {w:"regi",t:"« Dernière entrée. Une jeune fille du village est descendue jusqu'ici, seule, en chantant. Elle a fermé l'écluse de ses mains. Quand elle est repartie, elle n'y voyait presque plus. »"},
  {w:"moi",t:"Sur la dernière page, de l'écriture ronde du vieux carnet, deux lignes : le deuxième couplet du cheval bleu."},
  {w:"moi",t:"Il parle d'une rivière qu'on traverse sans se mouiller. Je le fredonne, et l'eau me paraît moins lourde."}]);
}

 {w:"suie",t:"Regarde ta flamme : elle se couche du côté où l'air s'en va. Et la poussière, dans ta lumière, te dessine le chemin du vent."},

const FAIM_L=[

 {w:"grelot",t:"Et quand il a le ventre plein, il s'écroule et il digère. Là, même moi j'irais lui tirer les moustaches. Enfin… toi d'abord."}];

const OUIE=[
 {w:"suie",t:"Viens là, toi. Tu es descendu combien de fois, déjà ? Et tu cours toujours comme un tombereau de ferraille."},

 {w:"suie",t:"Et retiens ceci : ces bêtes ne regardent que devant elles. Lumière douce, pas lents, par derrière. Mais si ta lampe allonge leur ombre sous leurs pattes, c'est fichu."}];
const LETTER=[
 {w:"lise",t:"« Papa, Mamie Suie dit que tu reviendras quand la lanterne s'éteindra. Je ne comprends pas. Elle ne s'éteint jamais. »"},

function startRun(floor,resume){
 audio();
 const rested=resume?resume.rested:(S.day!==today());
 if(!resume){S.day=today();S.runs++}
 run={loot:resume?resume.loot:0,mat:Object.assign({chit:0,gland:0,crist:0,brai:0,pale:0,nacr:0,lton:0},resume&&resume.mat),kills:0,max:floor,rested,startLoot:resume?resume.loot:0,gch:resume&&resume.gch!=null?resume.gch:gadMax(),bait:resume&&resume.bait||0};
 enterFloor(floor,resume?resume.hp:null,resume?resume.oil:null);
}

 if(f>=2)S.seen.air2=1;
 genFloor(f);bul=[];parts=[];tele=[];nums=[];ftx.length=0;foot.length=0;HUDS.o='';HUDS.at=HUD_ARR;
 P=newPlayer(hp,oil);run.max=Math.max(run.max,f);
 if(f>S.best&&f>1){const v=Math.round(40*f*deep(f));run.loot+=v;floatTxt(P.x,P.y-1.2,"Nouvel étage · +"+v+" ⛏")} // prime de record : c'est la progression qui paie
 if(f>run.lastF){run.gch=Math.min(gadMax(),run.gch+1)}run.lastF=Math.max(run.lastF||0,f);
 S.run={floor:f,hp:P.hp,oil:P.oil,loot:run.loot,mat:Object.assign({},run.mat),rested:run.rested,gch:run.gch,bait:run.bait};if(f>S.best||!S.st.reach[f]){if(!S.st.reach[f])S.st.reach[f]={t:Math.round(S.st.tot),p:Math.round(S.st.pts),d:S.deaths}}S.best=Math.max(S.best,f);save();
 state="play";paused=false;
 ["sheet","vhud","vlabel"].forEach(i=>$(i).classList.add("hide"));["hud","ctrl","pause","bAuto","bLamp"].forEach(i=>$(i).classList.remove("hide"));gobs=[];updGad();missionIntro();$("pause").textContent="II";fireB._s=null;fireB.style.opacity=1;fireB.innerHTML="TIR";updBtns();
 if(!S.seen.ctrl){S.seen.ctrl=1;save();pop("🏮 Comment jouer",
  "<p>👆 Glisse le pouce à gauche de l'écran pour bouger. Ta lanterne éclaire là où tu marches.</p><p>🔫 TIR AUTO : tu tires seul dès qu'un ennemi entre dans ta lumière. Coupe-le pour t'infiltrer.</p><p>🕯 LUMIÈRE VIVE : tu vois loin, mais on te voit de loin. LUMIÈRE DOUCE : tu es discret, presque aveugle, et l'huile dure plus longtemps.</p><p>🤫 Les créatures ne voient que devant elles. Arrive par derrière, en lumière douce : le bouton devient NEUTRALISER. Silencieux, et ça rapporte plus.</p><p>〰 Le bruit se voit : il suit les galeries et tourne aux coins. Pousse le pouce à moitié pour marcher sans bruit : tes traces de pas restent pâles. Ambre ou orange, on t'entend.</p>")}
 if(f===2&&!S.seen.f2){S.seen.f2=1;save();say([{w:"echo",t:"…tu entends les gouttes ? Elles tombent vers le haut, parfois. Ne te retourne pas."}])}
 if(f===6&&!S.seen.f6){S.seen.f6=1;save();say([{w:"moi",t:"Des cristaux… Leur lumière est froide. Elle éclaire, mais elle ne réchauffe rien."}])}
 if(f===11&&!S.seen.f11){S.seen.f11=1;save();say([{w:"moi",t:"Il fait chaud. La roche est veinée de rouge, comme si quelque chose couvait derrière."},{w:"moi",t:"Des flèches à la craie, sur la paroi. Elles pointent toutes vers le bas."}])}
 if(f===16&&!S.seen.f16){S.seen.f16=1;save();lull(.03,0);say([{w:"moi",t:"Plus de braise. Plus un bruit. Ma flamme rétrécit, comme si le noir appuyait dessus."},{w:"echo",t:"Ici, je n'ose plus parler fort. Écoute… tout en bas. Quelqu'un chante."}])}
 if(L.npc&&L.npc.lise)setTimeout(()=>lull(.03,0),1800);
 if(f===21&&!S.seen.f21){S.seen.f21=1;save();say([{w:"moi",t:"De l'eau. Partout. Noire, immobile, tiède."},{w:"moi",t:"Mon Écho ne m'a pas suivi jusqu'ici. Il n'y a plus que moi, et le bruit de mes pas qui s'éteint dans l'eau."}])}
 if(f===41&&!S.seen.f41){S.seen.f41=1;save();say([{w:"moi",t:"Des rails. Des wagonnets, des réverbères sur des poteaux de fer."},{w:"moi",t:"Ici, on ne descendait plus pour la journée. On descendait pour rester, et tout le matériel descendait avec."}])}
 if(f===50&&!S.seen.f50){S.seen.f50=1;save();say([{w:"moi",t:"Des caisses empilées, des tonneaux cerclés de fer. Un relais. Ils vivaient ici des semaines entières."}])}
 if(f===33&&!S.seen.f33){S.seen.f33=1;save();say([{w:"moi",t:"Les parois sont maçonnées. Des pierres taillées, des joints, des anneaux de fer scellés. Quelqu'un a construit, ici."}])}
 if(f===40){L.bossIntro=false;say([{w:"moi",t:"Une salle immense, taillée droit. Trois bassins, et sur la rive, trois grandes roues de fer."},{w:"moi",t:"Quelque chose de très gros tourne sous l'eau. Ces roues… ce sont des vannes."}],()=>{L.bossIntro=true;SFX.boss();shake=.4})}
 if(f===20){L.bossIntro=false;lull(.045,0);say([{w:"echo",t:"Je ne peux pas te suivre plus bas. Celui qui chante ici est plus vieux que moi. C'est le premier d'entre nous."},{w:"echo",t:"Il porte ta lanterne. Tu portes la sienne. Ne lui demande pas laquelle est la vraie."},{w:"prem",t:"…Encore un qui descend. Tu viens me prendre la chanson ? C'est tout ce qui le fait dormir."}],()=>{L.bossIntro=true;SFX.boss();shake=.4})}
 if(f===10){L.bossIntro=false;say([{w:"echo",t:"Elle garde la porte. Ne regarde pas ses yeux. Regarde le sol : il te dit où elle va frapper."},{w:"echo",t:"Et… si tu tombes, je serai là. Je suis toujours là."}],()=>{L.bossIntro=true;SFX.boss();shake=.4})}
}
function stairsMenu(){
 if(L.f===MAXF){pop("Au bout de la voie","<p>Plus bas, la voie continue dans le noir. Les rails sont froids. Quelqu'un a éteint toutes les lampes au-delà.</p><p style='opacity:.7'>La suite du puits arrive.</p>",[["⬆ Remonter avec le butin",()=>finishRun(false)],["Rester ici",null]]);return}
 let after=null;
 if(L.mis==="sauver"&&L.npc&&!L.npc.gone){if(Math.hypot(L.npc.x-P.x,L.npc.y-P.y)>3){floatTxt(P.x,P.y-1,"Attends "+L.npc.name+" !");L.menuShown=false;return}
  if(!L.npc.saved){L.npc.saved=true;S.st.saved++;const v=Math.round(15*L.f*deep(L.f)*(run.rested?1.5:1));run.loot+=v;if(L.npc.lise){S.lise=1;L.npc.gone=1;after=LISE_UP}save();floatTxt(P.x,P.y-1,"+"+v+" ⛏ · "+L.npc.name+" est sauf"+(L.npc.lise?"ve":""))}}
 const nf=L.f+1;
 const menu=()=>pop("Escalier — étage "+L.f,"<p>Tu portes ⛏ "+fmt(run.loot)+" "+matStr(run.mat,true)+".</p><p>🕯 Huile : "+Math.round(P.oil)+" / "+P.moil+".</p><p>Plus bas, c'est plus dangereux, mais ça rapporte davantage. Si tu meurs, tu ne remontes qu'avec un quart de ce que tu portes.</p>",
  [["⬇ Descendre à l'étage "+nf,()=>enterFloor(nf,P.hp,P.oil)],["⬆ Remonter avec le butin",()=>finishRun(false)],["Rester ici",null]]);
 if(after)say(after,menu);else menu();
}
function die(){
 if(state!=="play")return;state="dead";paused=true;

  h=`<h2>💾 Sauvegardes</h2>`+[1,2].map(n=>{const cur=n===SLOT,i=cur?"étage "+S.best+" · "+fmtT(S.st.tot):si(n);return`<div class="it"><div>Partie ${n}${cur?" ✓":""}<small>${i||"vide"}${cur?" · en cours":""}</small></div>${cur?"":`<button class="b" data-slot="${n}">${i?"Jouer":"Commencer"}</button>`}</div>`}).join("")+`<div style="font-size:12px;color:#ffcf7a;margin-top:12px;text-align:left">Code de secours · partie ${SLOT}</div><p style="font-size:12px;opacity:.8">Copie ce code et garde-le (notes, message à toi-même). Pour restaurer ta partie, colle-le dans la case du dessous.</p><button class="b" id="exp" style="width:100%;padding:10px">📋 Copier mon code</button><textarea id="expta" readonly class="hide" style="width:100%;height:60px;margin-top:6px;background:#0a0806;color:#e8dcc4;border:1px solid #e8a33c55;font-size:9px"></textarea><textarea id="impta" placeholder="Colle un code ici…" style="width:100%;height:60px;margin-top:12px;background:#0a0806;color:#e8dcc4;border:1px solid #e8a33c55;font-size:10px;user-select:text;-webkit-user-select:text"></textarea><button class="b" id="imp" style="width:100%;padding:10px;margin-top:6px">📥 Charger ce code</button>`}
 else if(k==="lise"){ // la boîte de Lise : tout ce que tu as trouvé en bas, à relire
  const bt=(rd,l)=>`<button class="b" data-rd="${rd}" style="padding:9px 0;min-width:44px;flex:0 0 auto">${l}</button>`,grp=(t,a)=>a.length?`<div style="font-size:12px;color:#ffcf7a;margin-top:10px;text-align:left">${t}</div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">${a.join("")}</div>`:"";
  const pg=Object.entries(PAGES).filter(([q])=>S.seen["pg_"+q]).sort((a,b)=>a[1].f-b[1].f).map(([q,p])=>bt("pg:"+q,"é."+p.f));
  const lt=(S.letter?[bt("lt:1","é.4")]:[]).concat(S.seen.let2?[bt("lt:2","é.12")]:[]);
  const d1=[];for(let i=0;i<Math.min(S.st.docs-(S.st.docs2||0),DOCS.length);i++)d1.push(bt("d1:"+i,"n°"+(i+1)));
  const d2=[];for(let i=0;i<Math.min(S.st.docs2||0,DOCS2.length);i++)d2.push(bt("d2:"+i,"n°"+(DOCS.length+i+1)));
  h=`<h2>🎠 Chez Lise</h2><div class="sub" style="text-align:left">« J'ai tout rangé dans ma boîte. Tu veux relire ? »</div>`+grp("Pages de carnet",pg)+grp("Mes lettres",lt)+grp("Papiers de la Compagnie",d1.concat(d2))+(pg.length+lt.length+d1.length+d2.length?"":`<div class="it">La boîte est vide, pour l'instant.</div>`)}
 else if(k==="gear"){h=`<h2>⚙ Réglages</h2><div class="row" style="margin-bottom:6px"><button class="b" id="gst" style="flex:1;padding:10px">📊 Statistiques</button><button class="b" id="gsv" style="flex:1;padding:10px">💾 Sauvegardes</button></div><div class="tog">Chiffres de dégâts<button class="b" data-opt="nums">${S.opt.nums?"Oui":"Non"}</button></div><div class="tog">Mode économie (vieux appareils)<button class="b" data-opt="eco">${S.opt.eco?"Oui":"Non"}</button></div><div class="tog">Son<button class="b" data-opt="son">${S.opt.son?"Oui":"Non"}</button></div><div class="tog">Effacer la partie<button class="b" id="reset">Effacer</button></div>`}
 h+=`<button class="b" id="shx" style="width:100%;margin-top:12px;padding:11px">✕ Fermer</button>`;
 sh.innerHTML=h;sh.classList.remove("hide");
 $("shx").onclick=closePanel;
 sh.querySelectorAll("[data-slot]").forEach(b=>b.onclick=()=>{save();try{localStorage.setItem("lanterne_slot",b.dataset.slot)}catch(e){}location.reload()});
 if($("gst"))$("gst").onclick=()=>openPanel("stats");if($("gsv"))$("gsv").onclick=()=>openPanel("save");
 sh.querySelectorAll("[data-gad]").forEach(b=>b.onclick=()=>{const kk=b.dataset.gad,l=S.gad[kk],c=l>=0?GAD[kk].up(l):GAD[kk].buy;if(canPay(c)){pay(c);if(l<0){S.gad[kk]=0;if(!S.gad.eq)S.gad.eq=kk}else S.gad[kk]++;save();SFX.pick();openPanel(k);vhud()}});
 sh.querySelectorAll("[data-geq]").forEach(b=>b.onclick=()=>{S.gad.eq=b.dataset.geq;save();openPanel(k)});
 const copyTxt=(txt,ta)=>{const el=$(ta);el.value=txt;el.classList.remove("hide");try{navigator.clipboard.writeText(txt).then(()=>floatMsg("Copié ✓"),()=>{el.select();floatMsg("Sélectionne et copie le texte")})}catch(e){el.select()}};
 if($("cpst"))$("cpst").onclick=()=>{const r=S.st.reach;const txt="Lanterne · stats\nTotal "+fmtT(S.st.tot)+" · puits "+fmtT(S.st.pts)+"\nRecord étage "+S.best+" · descentes "+S.runs+" · morts "+S.deaths+" · ennemis "+S.st.kills+" · mineurs "+S.st.saved+"\nPaliers : "+Object.keys(r).sort((a,b)=>a-b).map(f=>"É"+f+" "+fmtT(r[f].t)+" (puits "+fmtT(r[f].p)+", "+r[f].d+" morts)").join(" | ")+"\nCanon "+MATS[S.up.mat]+" cal"+S.up.cal+" méca"+S.up.meca+" ray"+S.up.ray+" · lanterne mèche"+S.up.meche+" verre"+S.up.verre+" refl"+S.up.refl+" rés"+S.up.res+" · armure "+S.arm.eq+" · mine "+S.mine+" · ⛏ "+fmt(S.ore)+"\nAir : caches "+(S.st.cache||0)+" · flairé "+(S.st.sniff||0)+" · coups de grisou "+(S.st.boom||0)+"\nFaim : viande prise "+(S.st.meat||0)+" · appâts posés "+(S.st.bait||0)+" · bêtes tuées entre elles "+(S.st.bk||0)+" · neutralisées endormies "+(S.st.napk||0)+" · Gloutons "+(S.st.glou||0)+"\nProfondeurs : brûlures "+(S.st.burn||0)+" · évents "+(S.st.vent||0)+" · cristaux chantés "+(S.st.sing||0)+" · mineurs gris brisés "+(S.st.fige||0)+" (coups reçus "+(S.st.figeHit||0)+") · Lise "+(S.lise?"oui":"non")+" · Premier Écho "+(S.won2?"oui":"non")+" · 🔥 "+S.mat.brai+" · ⚪ "+S.mat.pale+" · armure niv "+S.arm[S.arm.eq]+" · bouche "+(S.muz===2?"étouffée":"ouverte")+"\nEaux : nage "+fmtT(S.st.swim||0)+" · sangsues "+(S.st.lee||0)+" · avens "+(S.st.aven||0)+" · morsures du nageur "+(S.st.nbite||0)+" · nageurs tués "+(S.st.nage||0)+" · lucioles "+(S.st.luci||0)+" · vannes "+(S.st.vanne||0)+" · gardien échoué "+(S.st.strand||0)+" · écluse "+(S.won3?"oui":"non")+" · 🐚 "+(S.mat.nacr||0)+" · mèche "+S.up.meche+"\nCompagnie : lampes éteintes "+(S.st.snuf||0)+" · rallumées "+(S.st.relit||0)+" · charges tombées "+(S.st.hoist||0)+" · cailloux "+(S.st.peb||0)+" · carcasses traînées "+(S.st.lbait||0)+" · pris sur le fait "+(S.st.lcatch||0)+" · fuites "+(S.st.lflee||0)+" · cicatrices "+((S.lamp&&S.lamp.sc)||0)+" · 🔩 "+(S.mat.lton||0)+" · doublure "+(S.dbl?"oui":"non");copyTxt(txt,"cpta")};
 if($("exp"))$("exp").onclick=()=>{let code="";try{code="LNT1:"+btoa(unescape(encodeURIComponent(JSON.stringify(S))))}catch(e){}copyTxt(code,"expta")};
 if($("imp"))$("imp").onclick=()=>{const v=$("impta").value.trim();try{if(!v.startsWith("LNT1:"))throw 0;const o=JSON.parse(decodeURIComponent(escape(atob(v.slice(5)))));if(typeof o.ore!=="number")throw 0;pop("Charger ce code ?","<p>Ta partie actuelle sera remplacée par celle du code.</p>",[["Oui, charger",()=>{S=o;save();location.reload()}],["Annuler",null]])}catch(e){floatMsg("Code invalide")}};
 if($("go"))$("go").onclick=()=>{closePanel();if(S.run){const r=S.run;startRun(r.floor,r)}else startRun(1)};
 sh.querySelectorAll("[data-lift]").forEach(b=>b.onclick=()=>{closePanel();startRun(+b.dataset.lift)});
 sh.querySelectorAll("[data-rd]").forEach(b=>b.onclick=()=>{const[t,q]=b.dataset.rd.split(":");closePanel();say(t==="pg"?PAGES[q].t:t==="lt"?(q==="1"?LETTER:LETTER2):[{w:"doc",t:(t==="d2"?DOCS2:DOCS)[+q]}],()=>openPanel("lise"))});
 sh.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{const kk=b.dataset.up,cst=UPS[kk].cost(S.up[kk]);if(canPay(cst)){pay(cst);S.up[kk]++;save();SFX.pick();openPanel(k);vhud();const ln=SUIE[kk+S.up[kk]];if(ln)say([{w:"suie",t:ln}]);if(kk==="mat")refreshVillage()}});
 if($("dbl"))$("dbl").onclick=()=>{if(S.dbl||!canPay(DBLC))return;pay(DBLC);S.dbl=1;save();SFX.pick();openPanel(k);vhud();say([{w:"suie",t:SUIE.dbl}])};
 if($("muz"))$("muz").onclick=()=>{const first=!S.muz;if(first){if(!canPay(MUZC))return;pay(MUZC);S.muz=2}else S.muz=S.muz===2?1:2;save();SFX.pick();openPanel(k);vhud();if(first)say([{w:"suie",t:"Une bouche étouffée. Ton canon ne criera plus, il toussera. Il mordra un peu moins fort, aussi. On n'a rien sans rien."}])};
 sh.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{atTab=b.dataset.tab;openPanel(k)});
 sh.querySelectorAll("[data-eq]").forEach(b=>b.onclick=()=>{S.arm.eq=b.dataset.eq;save();openPanel(k)});
 sh.querySelectorAll("[data-arm]").forEach(b=>b.onclick=()=>{const kk=b.dataset.arm,l=S.arm[kk],cst=l>=0?armUpCost(kk,l):ARMBUY[kk];if(canPay(cst)){pay(cst);if(l<0){S.arm[kk]=0;S.arm.eq=kk;if(SUIE[kk])say([{w:"suie",t:SUIE[kk]}])}else S.arm[kk]++;save();SFX.pick();openPanel(k);vhud()}});
 if($("mineup"))$("mineup").onclick=()=>{const cst=mineCost(S.mine);if(S.ore>=cst){const p=passive();S.ore+=Math.floor(p.m);S.lastM=Date.now();S.ore-=cst;S.mine++;save();SFX.pick();refreshVillage();openPanel(k);vhud()}};
 sh.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{S.opt[b.dataset.opt]=!S.opt[b.dataset.opt];save();openPanel(k)});
 if($("reset"))$("reset").onclick=()=>pop("Effacer la partie "+SLOT+" ?","<p>Tout sera perdu pour cette partie : minerai, Échos, améliorations. L'autre partie n'est pas touchée.</p>",[["Oui, tout effacer",()=>{try{localStorage.removeItem(SKEY)}catch(e){}location.reload()}],["Annuler",null]]);
}
function floatMsg(t){const b=$("banner");b.innerHTML="<small style='font-size:14px'>"+t+"</small>";b.classList.remove("hide");b.style.opacity=1;clearTimeout(b._t);b._t=setTimeout(()=>{b.style.opacity=0;setTimeout(()=>b.classList.add("hide"),1000)},1500)}
function closePanel(){$("sheet").classList.add("hide");panelK=null;if($("dlg").classList.contains("hide")&&$("pop").classList.contains("hide"))paused=false}
function bank(){const p=passive();S.ore+=Math.floor(p.m+p.e);S.lastM=S.lastE=S.last=Date.now()}
function checkUnlocks(dead){
 const steps=[];
 if(!S.un.atelier)steps.push(["atelier",[{w:"suie",t:"Tu es revenu. Bien. Tu sens le sang de Rampant, c'est mieux que de sentir le tien."},{w:"suie",t:"Ramène-moi du minerai et je t'améliore ce vieux canon. Et ne mens pas sur la quantité : je l'entends tinter dans ton sac."}],"🔓 Atelier de Mamie Suie","<p>Avec le minerai et les restes des monstres (🦂 chitine, 🧪 glande, 💎 cristal), Mamie Suie améliore ton canon, ta lanterne et ton armure.</p><p>La matière du canon limite tout le reste : plus elle est noble, plus tu peux pousser le calibre et le mécanisme.</p>"]);
 if(dead&&!S.un.echos)steps.push(["echos",[{w:"echo",t:"…tiens. C'est toi. Ou c'est moi. Le puits ne fait pas bien la différence."},{w:"echo",t:"Je reste en bas. Je ne trouve pas le repos. Viens me chercher… et je creuserai pour toi."},{w:"suie",t:"…Tu as entendu ça aussi ? Non. Rien. Laisse."}],"🔓 Les Échos","<p>Chaque mort laisse un Écho à l'étage où tu es tombé. Il naît tourmenté et ne fait rien.</p><p>Redescends jusqu'à son étage et retrouve-le : une fois apaisé, il creuse pour toi, même quand tu ne joues pas. Plus il est profond, plus il rapporte.</p><p>3 Échos maximum. La récolte s'accumule jusqu'à 12 h.</p>"]);
 if(!S.un.mine&&(S.runs>=2||S.best>=3))steps.push(["mine",[{w:"grelot",t:"Salut, salut ! Grelot, ingénieur diplômé ! …Diplômé par moi-même, mais diplômé quand même."},{w:"grelot",t:"J'ai remis la vieille mine en marche. Elle a explosé une seule fois, et c'était pendant un test, donc ça ne compte pas."},{w:"grelot",t:"Elle creuse quand tu n'es pas là. Mets-y du minerai, je la rends plus rapide. Promis, pas d'explosion. Presque promis."}],"🔓 La mine de Grelot","<p>Elle produit du minerai pendant ton absence, jusqu'à 12 h. Améliore-la pour qu'elle produise plus.</p><p>Pas de notification : tu récoltes quand tu reviens.</p>"]);
 if(!S.un.petard&&S.best>=8)steps.push(["petard",[{w:"petard",t:"BOUM ! …Pardon. Salut ! Pétard, ancien artificier de la Compagnie. Il me reste sept doigts, ce qui est un excellent score dans le métier."},{w:"petard",t:"J'ai retapé ma cabane, la noircie, près du puits. Ramène-moi de la glande de Cracheur : ça fait une poudre formidable. Et de la chitine pour les coques."},{w:"petard",t:"Grenades, leurres, fumigènes… Mode d'emploi : tu lances, et tu cours. Surtout, tu cours."}],"🔓 La poudrière de Pétard","<p>Fabrique un gadget et équipe-le : un bouton apparaît pendant tes descentes.</p><p>Tu as quelques charges par descente, et tu en regagnes une à chaque nouvel étage.</p>"]);
 if(!S.un.monte&&S.best>=5)steps.push(["monte",[{w:"grelot",t:"Grande nouvelle ! J'ai bricolé un monte-charge jusqu'à l'étage 5 ! Il a marché deux fois sur trois. La troisième fois… c'était le test, encore."}],"🔓 Le monte-charge","<p>Tu peux maintenant commencer une descente directement à l'étage 5.</p>"]);
 if(S.lise&&!S.un.lise)steps.push(["lise",[{w:"suie",t:"…Ce pas-là. Petit, léger, qui traîne du pied gauche. Lise ?"},{w:"lisa",t:"Mamie ! J'ai vu la grande porte ! Et j'ai presque trouvé Papa !"},{w:"suie",t:"…"},{w:"suie",t:"Toi. Tu me l'as remontée. Je ne dis jamais merci, alors écoute bien, parce que je ne le redirai pas : merci."}],"🔓 La maison aux volets bleus","<p>Lise est rentrée, et le village a relevé sa maison.</p><p>Elle garde dans sa boîte tout ce que tu trouves en bas : pages de carnet, lettres, papiers de la Compagnie. Tu peux les relire chez elle.</p><p>Elle t'a appris le début de sa chanson. Quand tu la fredonnes, les créatures doutent un peu plus longtemps avant de donner l'alerte.</p>"]);
 if(S.won&&!S.un.monte2)steps.push(["monte2",[{w:"grelot",t:"J'ai rallongé le câble ! Il descend maintenant jusque sous la grande porte. Ne me demande pas comment je l'ai fait passer devant Elle."},{w:"grelot",t:"Indice : très vite, et en criant."}],"🔓 Monte-charge · étage 11","<p>Tu peux commencer une descente directement à l'étage 11, sous la grande porte.</p>"]);
 if(S.best>=16&&!S.un.monte3)steps.push(["monte3",[{w:"grelot",t:"Le câble descend encore plus bas ! Il fait maintenant un bruit de violoncelle. C'est nouveau, donc c'est peut-être normal."}],"🔓 Monte-charge · étage 16","<p>Tu peux commencer une descente directement à l'étage 16.</p>"]);
 if(S.won2&&!S.un.fin2)steps.push(["fin2",[{w:"suie",t:"Tu fredonnes. …Où as-tu appris cet air ?"},{w:"suie",t:"Mon fils le chantait à la petite. Personne d'autre ne le connaissait."},{w:"suie",t:"Non. Ne me dis pas qui te l'a appris. Pas encore. Redescends, et rapporte-moi la suite."}].concat(S.un.lise||S.lise?[{w:"lisa",t:"C'est le premier couplet ! Papa disait qu'il y en a autant que de portes. Je n'ai jamais su combien il y a de portes."}]:[]),"👑 Le premier couplet","<p>Tu connais le premier couplet de la chanson du cheval bleu : les créatures doutent nettement plus longtemps avant de donner l'alerte.</p><p>Le Premier Écho s'est apaisé. Il creuse pour toi, tout au fond, comme les autres Échos.</p><p style='opacity:.7'>Sous la Chambre du Chant, l'escalier continue.</p>"]);
 if(S.won2&&!S.un.monte4)steps.push(["monte4",[{w:"grelot",t:"J'ai fait passer le câble sous la Chambre du Chant ! Il en remonte mouillé. Je préfère ne pas savoir pourquoi."}],"🔓 Monte-charge · étage 21","<p>Tu peux commencer une descente directement à l'étage 21.</p>"]);
 if(S.best>=31&&!S.un.monte5)steps.push(["monte5",[{w:"grelot",t:"Trente et un ! Le câble est si long qu'il faut une journée pour le dérouler. Enfin, une minute. Mais une très longue minute."}],"🔓 Monte-charge · étage 31","<p>Tu peux commencer une descente directement à l'étage 31.</p>"]);
 if(S.won3&&!S.un.monte6)steps.push(["monte6",[{w:"grelot",t:"Quarante et un ! Sous l'écluse, j'ai trouvé un câble de la Compagnie. Il est meilleur que le mien. Ne le dis pas au mien."}],"🔓 Monte-charge · étage 41","<p>Tu peux commencer une descente directement à l'étage 41.</p>"]);
 if(S.won3&&!S.un.fin3)steps.push(["fin3",[{w:"suie",t:"Tu sens l'eau de la grande écluse. Cette odeur-là, je l'ai gardée cinquante ans dans le nez."},{w:"suie",t:"Oui, j'y suis descendue. J'avais dix-sept ans, et deux yeux qui marchaient."},{w:"suie",t:"Pourquoi, et pour qui : pas aujourd'hui. Fredonne-moi plutôt le couplet. …Tu chantes faux. Lui aussi chantait faux."}].concat(S.un.lise||S.lise?[{w:"lisa",t:"Deux couplets ! Mamie, pourquoi tu pleures ?"},{w:"suie",t:"Je ne pleure pas. C'est la fumée de la forge."}]:[]),"👑 Le deuxième couplet","<p>Tu connais le deuxième couplet du cheval bleu : tu nages plus vite, et ce qui vit sous l'eau te sent de moins loin.</p><p style='opacity:.7'>Sous l'écluse, l'escalier continue.</p>"]);
 const go=i=>{const st=steps[i];if(!st){airLesson();return}bank();S.un[st[0]]=1;save();refreshVillage();say(st[1],()=>pop(st[2],st[3],[["Compris ✓",()=>go(i+1)]]))};
 go(0);
}
function pauseMenu(){if(state!=="play")return;paused=true;pop("Pause","<p>Étage "+L.f+" · ⛏ "+fmt(run.loot)+" "+matStr(run.mat,true)+"</p><p style='color:#d9c9a3'>"+HUDS.o+"</p><p style='opacity:.7'>Si tu quittes, tu reprendras au début de cet étage avec ce que tu portais en y entrant.</p>",[["▶ Reprendre",null],["🏘 Quitter (partie gardée)",()=>enterVillage()]])}

// ================= DÉMARRAGE =================
enterVillage();
if(!S.seen.intro){S.seen.intro=1;S.seen.ouie=1;save();say(INTRO)}
else if(!S.seen.ouie){S.seen.ouie=1;save();say(OUIE)}
else if((S.won&&!S.un.monte2)||(S.lise&&!S.un.lise)||(S.won2&&!S.un.fin2))checkUnlocks(false);
</script>
</body>
</html>
